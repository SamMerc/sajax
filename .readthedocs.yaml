# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# The docs are built with uv from the committed uv.lock, so Read the Docs gets
# the same package versions as CI and local development. This uses the custom
# `build.commands` path, which replaces the `python:` and `sphinx:` keys --
# those are not allowed alongside it.
build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  commands:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    # --locked fails the build if uv.lock is out of date with pyproject.toml,
    # matching the check in .github/workflows/tests.yml.
    - $HOME/.local/bin/uv sync --locked --extra docs
    - $HOME/.local/bin/uv run --no-sync sphinx-build -b html docs $READTHEDOCS_OUTPUT/html
