version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    # binder/requirements.txt is generated from uv.lock by .github/workflows/sync-binder.yml
    exclude-paths:
      - "binder/**"
    groups:
      python-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "setuptools"
      # speclib caps astropy<8; Dependabot's astropy 8 bump is unresolvable and fails the whole group.
      - dependency-name: "astropy"
        update-types: ["version-update:semver-major"]
