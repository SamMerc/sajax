name: Build JOSS Paper Draft

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths:
      - "joss/**"
      - ".github/workflows/draft-pdf.yml"
  push:
    branches:
      - main
      - joss_paper # (to be removed after branch is merged into main)
      - "releases/**"
    paths:
      - "joss/**"
      - ".github/workflows/draft-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Paper Draft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install figure dependencies
        run: python -m pip install numpy matplotlib

      - name: Generate main figure
        run: python joss/figures/joss_figure.py

      - name: Check figure was produced
        run: test -s joss/figures/main_plot.pdf

      - name: Build draft PDF
        uses: openjournals/openjournals-draft-action@v1.0
        with:
          journal: joss
          paper-path: joss/paper.md

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: paper
          path: joss/paper.pdf
