name: Sync Binder requirements

# Regenerates binder/requirements.txt from uv.lock on Dependabot PRs.
# pull_request_target is needed because Dependabot's pull_request token is read-only.
# Only `uv export` runs here (no PR code is executed), and the actor guard limits it to Dependabot.
on:
  pull_request_target:
    paths: ["uv.lock", "pyproject.toml"]

permissions:
  contents: write

jobs:
  sync:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - uses: astral-sh/setup-uv@v6

      - name: Export lockfile to binder/requirements.txt
        run: uv export --format requirements-txt --extra docs --group examples --no-hashes > binder/requirements.txt

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add binder/requirements.txt
          git diff --cached --quiet || { git commit -m "Sync binder/requirements.txt from uv.lock" && git push; }
